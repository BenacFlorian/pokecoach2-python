[project]
name = "pokecoach-python"
version = "0.1.0"
description = "PokeCoach2 FastAPI commands and workers"
readme = "README.md"
authors = [
    { name = "Florian Benac", email = "florian.benac@webinage.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
