[project]
name = "pokecoach-vgc-bridge"
version = "0.1.0"
description = "Isolated VGC-Bench / Showdown bridge for PokeCoach"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pokecoach-vgc-bridge = "pokecoach_vgc_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokecoach_vgc_bridge"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
